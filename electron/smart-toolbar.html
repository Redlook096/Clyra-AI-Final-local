<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  :root { color:#162033; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  * { box-sizing:border-box } body { margin:0; overflow:hidden; background:transparent; } button,select { font:inherit; } button { border:0; cursor:pointer; }
  #root { padding:10px; opacity:0; transform:translateY(-4px) scale(.98); transition:opacity .16s ease,transform .2s cubic-bezier(.16,1,.3,1); } #root.ready { opacity:1; transform:none; }
  .shell { overflow:hidden; border:1px solid rgba(205,220,240,.95); border-radius:18px; background:rgba(255,255,255,.98); box-shadow:0 18px 48px rgba(15,35,72,.16),0 2px 7px rgba(15,35,72,.07); backdrop-filter:blur(20px); }
  .toolbar { display:flex; align-items:center; gap:4px; min-height:48px; padding:5px; } .brand { display:grid; width:34px; height:34px; place-items:center; border-radius:12px; color:white; background:linear-gradient(145deg,#1677ff,#0052d6); box-shadow:inset 0 1px rgba(255,255,255,.36),0 4px 12px rgba(0,82,214,.22); font-size:15px; font-weight:800; }
  .action { height:34px; padding:0 10px; border-radius:11px; background:transparent; color:#475569; font-size:11px; font-weight:650; white-space:nowrap; transition:background .14s ease,color .14s ease,transform .14s ease; } .action:hover { background:#eff6ff; color:#075fd0; transform:translateY(-1px); } .action.primary { background:#0969eb; color:#fff; box-shadow:0 3px 9px rgba(9,105,235,.22); } .action.primary:hover { background:#005bd6; }
  .divider { width:1px; height:22px; margin:0 1px; background:#e6edf6; } select { width:78px; height:32px; border:0; border-radius:10px; outline:0; color:#53647c; background:#f6f9fd; padding:0 6px; font-size:10px; font-weight:650; }
  .card { display:none; border-top:1px solid #e9eff7; padding:12px; } .card.visible { display:block; } .label { display:flex; align-items:center; gap:7px; color:#1266df; font-size:10px; font-weight:750; letter-spacing:.04em; text-transform:uppercase; } .spark { width:7px; height:7px; border-radius:50%; background:#1677ff; box-shadow:0 0 0 4px #e7f1ff; }
  .answer { max-height:144px; overflow:auto; margin:8px 0 11px; color:#26364d; font-size:12px; font-weight:500; line-height:1.48; white-space:pre-wrap; } .loading:after { content:""; display:inline-block; width:5px; height:12px; margin-left:2px; vertical-align:-2px; border-radius:3px; background:#1976ef; animation:blink .8s ease infinite; }
  .card-actions { display:flex; gap:6px; } .secondary { height:30px; padding:0 9px; border:1px solid #dbe6f4; border-radius:9px; color:#52637a; background:#fff; font-size:10px; font-weight:700; } .secondary:hover { background:#f5f9ff; color:#075fd0; } .secondary.strong { border-color:#0b6eec; background:#0b6eec; color:#fff; }
  @keyframes blink { 50%{opacity:.18} } @media (prefers-reduced-motion:reduce) { *,#root { transition:none!important; animation:none!important; } }
</style></head><body><div id="root"><section class="shell"><div class="toolbar">
  <div class="brand" aria-label="Clyra">C</div><button class="action primary" data-action="ask">Ask Clyra</button><button class="action" data-action="explain">Explain</button><button class="action" data-action="rewrite">Rewrite</button><button class="action" data-action="summarise">Summarise</button><div class="divider"></div><button class="action" data-action="translate">Translate</button><select id="language" aria-label="Translate language"><option>English</option><option>Spanish</option><option>French</option><option>German</option><option>Japanese</option><option>Chinese</option></select><button class="action" data-action="more">More</button>
  </div><div id="card" class="card"><div class="label"><i class="spark"></i><span id="title">Clyra</span></div><div id="answer" class="answer"></div><div class="card-actions"><button class="secondary" data-action="copy">Copy</button><button class="secondary strong" data-action="replace">Replace selection</button><button class="secondary" data-action="below">Insert below</button></div></div>
</section></div><script>
  const root=document.querySelector('#root'), card=document.querySelector('#card'), answer=document.querySelector('#answer'), title=document.querySelector('#title'), language=document.querySelector('#language'); let state={}; let streamTimer=0;
  const actionLabels={ask:'Ask Clyra',explain:'Explanation',rewrite:'Rewrite',summarise:'Summary',translate:'Translation',more:'Clyra'};
  function render(next={}) { state={...state,...next}; clearInterval(streamTimer); root.classList.toggle('ready', state.visible!==false); card.classList.toggle('visible',!!state.card); title.textContent=actionLabels[state.action]||'Clyra'; const text=String(state.response||''); if(state.loading){answer.textContent='Thinking';answer.classList.add('loading');return;} answer.classList.remove('loading'); if(!text){answer.textContent='';return;} let i=0;answer.textContent='';streamTimer=setInterval(()=>{i=Math.min(text.length,i+Math.max(2,Math.ceil(text.length/80)));answer.textContent=text.slice(0,i);if(i>=text.length)clearInterval(streamTimer)},12); }
  document.querySelectorAll('[data-action]').forEach((button)=>button.addEventListener('click',()=>window.clyraSmartToolbar.action(button.dataset.action,button.dataset.action==='translate'?language.value:undefined)));
  language.addEventListener('change',()=>{if(state.action==='translate') window.clyraSmartToolbar.action('translate',language.value)}); window.clyraSmartToolbar.onState(render); render({visible:false});
</script></body></html>
