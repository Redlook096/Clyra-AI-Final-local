<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}body{margin:0;background:transparent;overflow:hidden}.pill{margin:10px auto;max-width:396px;min-height:52px;display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid rgba(148,163,184,.34);border-radius:17px;background:rgba(255,255,255,.96);box-shadow:0 14px 36px rgba(15,23,42,.14);backdrop-filter:blur(18px);transition:transform .2s cubic-bezier(.22,1,.36,1),opacity .2s}.signal{display:flex;align-items:center;gap:2px;width:28px;height:20px}.signal i{width:3px;border-radius:3px;background:#4f8ff7;transform:scaleY(calc(.28 + var(--level, 0) * .72));transform-origin:center;opacity:calc(.45 + var(--level, 0) * .55);transition:transform 90ms linear,opacity 90ms linear}.signal i:nth-child(2){height:14px}.signal i:nth-child(3){height:20px}.signal i:nth-child(4){height:11px}.copy{min-width:0;flex:1}.title{font-size:12px;font-weight:650}.detail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;font-size:11px;color:#718096}.actions{display:flex;gap:6px}button{border:1px solid #dbe3ef;border-radius:10px;background:#fff;color:#27364e;padding:6px 9px;font:600 11px inherit;cursor:pointer;transition:background .14s,transform .14s}button:hover{background:#f4f7fb;transform:translateY(-1px)}button.primary{border-color:#1d4ed8;background:#2563eb;color:#fff}button.close{padding:6px 8px}.preview .detail{white-space:nowrap}.error .signal i{background:#dc5b5b}
</style></head><body><main class="pill" id="pill"><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div class="copy"><div class="title" id="title">Clyra Dictation</div><div class="detail" id="detail"></div></div><div class="actions" id="actions"></div></main>
<script>const p=document.getElementById('pill'),t=document.getElementById('title'),d=document.getElementById('detail'),a=document.getElementById('actions');let signature='';function b(label,action,primary=false){const e=document.createElement('button');e.textContent=label;e.className=primary?'primary':'';e.onclick=()=>window.clyraDictationPill.action(action);a.append(e)}function render(s={}){p.style.setProperty('--level',String(Math.max(0,Math.min(1,Number(s.level)||0))));const next=[s.phase||'',s.detail||'',s.preview||''].join('|');if(next===signature)return;signature=next;a.innerHTML='';p.className='pill '+(s.phase||'');t.textContent=s.phase==='selection'?'Use selected text':s.phase==='listening'?'Listening':s.phase==='processing'?'Processing dictation':s.phase==='optimising'?'Optimising':s.phase==='preview'?'Rewrite preview':s.phase==='error'?'Dictation needs attention':'Clyra Dictation';d.textContent=s.preview||s.detail||'';if(s.phase==='selection'){b('Replace','replace',true);b('Optimise','optimise');b('×','cancel')}else if(s.phase==='listening'){b('Stop','stop',true);b('Cancel','cancel')}else if(s.phase==='preview'){b('Replace','replace-preview',true);b('Try again','try-again');b('Copy','copy');b('×','cancel')}else if(s.phase==='processing'||s.phase==='optimising'){b('Cancel','cancel')}else if(s.phase==='error'){b('Close','cancel')}}window.clyraDictationPill.onState(render);render();</script></body></html>
