<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clyra Companion</title>
  <style>
    :root {
      --accent: #3b82f6;
      --accent-deep: #2563eb;
      --glass: linear-gradient(135deg, rgba(255,255,255,0.94) 0%, rgba(248,250,255,0.9) 100%);
      --glass-dark: rgba(20, 21, 26, 0.86);
      --line: rgba(15, 23, 42, 0.09);
      --text: #16181d;
      --muted: rgba(22, 24, 29, 0.52);
      --danger: #dd5e58;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 8px;
    }
    /* ---------------- Chat panel (collapses to nothing) ---------------- */
    .chat-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--glass-dark);
      backdrop-filter: blur(28px);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 48px rgba(0,0,0,0.32);
      color: rgba(255,255,255,0.94);
      overflow: hidden;
      opacity: 0;
      transform: translateY(8px) scale(0.985);
      pointer-events: none;
      transition: opacity 0.22s cubic-bezier(.16,1,.3,1), transform 0.26s cubic-bezier(.16,1,.3,1);
      margin-bottom: 8px;
    }
    #root[data-expanded="true"] .chat-panel {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .chat-header {
      display: flex; align-items: center; gap: 5px;
      padding: 9px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    .chat-header .title { font-size: 12px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
    .chat-header .sub { font-size: 10px; color: rgba(255,255,255,0.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0; max-width: 96px; }
    .chat-header .spacer { flex: 1; min-width: 6px; }
    .icon-btn {
      -webkit-app-region: no-drag;
      height: 23px; min-width: 23px; padding: 0 6px;
      border-radius: 7px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85);
      font-size: 10px; font-weight: 600; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.14); }
    .icon-btn.recording { color: #93c5fd; border-color: rgba(147,197,253,0.4); background: rgba(59,130,246,0.18); }
    .log {
      flex: 1; min-height: 0; overflow: auto;
      padding: 12px 13px 6px; display: flex; flex-direction: column; gap: 8px;
      -webkit-app-region: no-drag;
    }
    .message {
      padding: 9px 11px; border-radius: 9px; border-left: 2.5px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.055); font-size: 12px; line-height: 1.5; word-break: break-word;
    }
    .message.user { background: rgba(59,130,246,0.14); border-left-color: rgba(147,197,253,0.8); }
    .message.assistant { background: rgba(255,255,255,0.06); border-left-color: rgba(255,255,255,0.22); }
    .message.system { background: rgba(255,255,255,0.04); border-left-color: rgba(255,255,255,0.14); color: rgba(255,255,255,0.62); font-size: 11px; }
    .message .vision { margin-top: 7px; padding-top: 7px; border-top: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); font-size: 10.5px; line-height: 1.45; }
    .thinking-row { display: flex; align-items: center; gap: 7px; color: rgba(255,255,255,0.55); font-size: 11.5px; }
    .thinking-row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dotpulse 1s ease-in-out infinite; }
    @keyframes dotpulse { 0%,100% { opacity: .35; transform: scale(1);} 50% { opacity: 1; transform: scale(1.2);} }
    .controls-row {
      display: none; margin: 0 11px 8px; height: 28px; border-radius: 8px; overflow: hidden;
      background: rgba(0,0,0,0.5); font-size: 10.5px; font-weight: 500; -webkit-app-region: no-drag;
    }
    .controls-row.show { display: flex; align-items: stretch; }
    .controls-row .pill { display: flex; align-items: center; gap: 7px; padding: 0 11px; flex: 1; min-width: 0; }
    .controls-row .live { width: 5px; height: 5px; border-radius: 999px; background: var(--accent); animation: dotpulse 1.2s ease-in-out infinite; }
    .controls-row button { border: 0; background: transparent; color: rgba(255,255,255,0.88); padding: 0 11px; cursor: pointer; font: inherit; font-size: 10px; font-weight: 600; border-left: 1px solid rgba(255,255,255,0.12); }
    .controls-row button:hover { background: rgba(255,255,255,0.08); }
    .controls-row button.stop { background: var(--danger); border-left: 0; }
    .controls-row button.hidden { display: none; }

    /* ---------------- Collapsed bar (always visible, always interactive) ---------------- */
    .bar {
      flex-shrink: 0;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px 0 6px;
      background: var(--glass);
      backdrop-filter: blur(24px);
      border-radius: 999px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px rgba(15,23,42,0.16), 0 1px 2px rgba(15,23,42,0.05);
      -webkit-app-region: drag;
    }
    .bar-input {
      flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
      font: inherit; font-size: 13px; color: var(--text); -webkit-app-region: no-drag;
    }
    .bar-input::placeholder { color: rgba(22,24,29,0.4); }
    .context-chip {
      display: none;
      align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px;
      background: rgba(59,130,246,0.1); color: var(--accent-deep); font-size: 10.5px; font-weight: 600;
      white-space: nowrap; -webkit-app-region: no-drag; flex-shrink: 0;
    }
    .context-chip.show { display: inline-flex; }
    .bar-btn {
      -webkit-app-region: no-drag;
      width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
      display: grid; place-items: center; flex-shrink: 0;
      background: transparent; color: rgba(22,24,29,0.62);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .bar-btn:hover { background: rgba(15,23,42,0.06); color: var(--text); }
    .bar-btn.recording { color: var(--danger); background: rgba(221,94,88,0.1); }
    .bar-btn svg { width: 16px; height: 16px; }

    /* ---------------- Blob (Clyra identity anchor) ---------------- */
    .blob-wrap {
      width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center;
      position: relative; -webkit-app-region: no-drag; cursor: pointer;
    }
    .blob-ring {
      position: absolute; inset: -5px; border-radius: 50%;
      border: 1.5px solid var(--accent); opacity: 0; transform: scale(0.8);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .blob-wrap[data-state="controlling"] .blob-ring { opacity: 0.55; transform: scale(1); animation: ringpulse 1.6s ease-in-out infinite; }
    @keyframes ringpulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.7; } }
    .blob-body {
      width: 28px; height: 28px; border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #6ea3ff 0%, var(--accent) 55%, var(--accent-deep) 100%);
      box-shadow: 0 2px 8px rgba(37,99,235,0.35);
      display: flex; align-items: center; justify-content: center; gap: 3.5px;
      transform: scale(1);
      transition: transform 0.18s cubic-bezier(.16,1,.3,1), filter 0.25s ease;
      will-change: transform;
    }
    .blob-eye {
      width: 3.4px; border-radius: 999px; background: #fff;
      transition: height 0.12s ease, transform 0.12s ease;
    }
    .blob-eye.l { height: 9px; }
    .blob-eye.r { height: 6px; margin-top: 3px; }
    /* idle: slow breathing */
    .blob-wrap[data-state="idle"] .blob-body { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    /* listening: scale driven by --amp (real mic amplitude, set from JS) */
    .blob-wrap[data-state="listening"] .blob-body { transform: scale(calc(1 + var(--amp, 0) * 0.16)); }
    .blob-wrap[data-state="listening"] .blob-eye.l { height: calc(9px - var(--amp, 0) * 2px); }
    /* capturing: one quick controlled ripple */
    .blob-wrap[data-state="capturing"] .blob-ring { opacity: 0.7; transform: scale(1.35); transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.16,1,.3,1); }
    .blob-wrap[data-state="capturing"] .blob-body { animation: capture-pulse 0.5s cubic-bezier(.16,1,.3,1); }
    @keyframes capture-pulse { 0% { transform: scale(1); } 40% { transform: scale(0.9); } 100% { transform: scale(1); } }
    /* thinking: tighter, concentrated pulse */
    .blob-wrap[data-state="thinking"] .blob-body { animation: think 0.9s ease-in-out infinite; }
    @keyframes think { 0%,100% { transform: scale(0.96); } 50% { transform: scale(1.06); } }
    /* speaking: procedural rhythmic pulse (Web Speech API exposes no real amplitude) */
    .blob-wrap[data-state="speaking"] .blob-body { transform: scale(calc(1 + var(--amp, 0) * 0.12)); }
    /* controlling: restrained, distinct — ring only, body calm */
    .blob-wrap[data-state="controlling"] .blob-body { filter: saturate(1.15); }
    /* error: one subtle desaturated tint, no flashing */
    .blob-wrap[data-state="error"] .blob-body { animation: err 0.5s ease; }
    @keyframes err { 0%,100% { filter: none; } 50% { filter: grayscale(0.4) saturate(0.7); } }
  </style>
</head>
<body>
  <div id="root" data-expanded="false">
    <div class="chat-panel" id="chatPanel">
      <div class="chat-header">
        <span class="title">Clyra Companion</span>
        <span class="sub" id="status">Ready · RapidOCR</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="guideBtn" type="button" title="Point at something without clicking">Guide</button>
        <button class="icon-btn" id="controlBtn" type="button" title="Let Clyra drive the cursor">Control</button>
        <button class="icon-btn" id="clearBtn" type="button">Clear</button>
        <button class="icon-btn" id="collapseBtn" type="button">⌄</button>
      </div>
      <div class="log" id="log">
        <div class="message system">Ask about your screen, a selected region, or speak — no stealth, always visible when I'm capturing.</div>
      </div>
      <div class="controls-row" id="controls">
        <div class="pill"><span class="live"></span><span id="controlLabel">AI has control</span></div>
        <button type="button" id="takeControl">Take control</button>
        <button type="button" id="resumeAi" class="hidden">Resume AI</button>
        <button type="button" class="stop" id="stopControl">Stop</button>
      </div>
    </div>

    <div class="bar" id="bar">
      <div class="blob-wrap" id="blobWrap" data-state="idle" title="Clyra">
        <div class="blob-ring"></div>
        <div class="blob-body">
          <div class="blob-eye l"></div>
          <div class="blob-eye r"></div>
        </div>
      </div>
      <input class="bar-input" id="input" placeholder="Ask Clyra…" autocomplete="off" spellcheck="false" />
      <span class="context-chip" id="contextChip"></span>
      <button class="bar-btn" id="micBtn" title="Talk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 19v3"/></svg>
      </button>
      <button class="bar-btn" id="seeBtn" title="See screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
  <script>
    const api = window.clyraCompanion;
    const root = document.getElementById("root");
    const chatPanel = document.getElementById("chatPanel");
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const status = document.getElementById("status");
    const controls = document.getElementById("controls");
    const controlLabel = document.getElementById("controlLabel");
    const takeControl = document.getElementById("takeControl");
    const resumeAi = document.getElementById("resumeAi");
    const stopControl = document.getElementById("stopControl");
    const blobWrap = document.getElementById("blobWrap");
    const contextChip = document.getElementById("contextChip");
    let expanded = false;
    let listening = false;
    let recognition = null;
    let voiceOn = true;
    let idleTimer = 0;

    function setBlob(state) {
      blobWrap.setAttribute("data-state", state);
    }

    function setContext(label) {
      if (!label) { contextChip.classList.remove("show"); contextChip.textContent = ""; return; }
      contextChip.textContent = label;
      contextChip.classList.add("show");
    }

    function expand() {
      if (expanded) return;
      expanded = true;
      root.setAttribute("data-expanded", "true");
      void api?.expand?.();
    }

    function scheduleCollapse(delay = 6000) {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (!input.value.trim() && !listening && blobWrap.dataset.state === "idle") collapse();
      }, delay);
    }

    function collapse() {
      if (!expanded) return;
      expanded = false;
      root.setAttribute("data-expanded", "false");
      void api?.collapse?.();
    }

    function append(role, text, extra) {
      const el = document.createElement("div");
      el.className = `message ${role === "user" ? "user" : role === "system" ? "system" : "assistant"}`;
      el.textContent = text;
      if (extra) {
        const v = document.createElement("div");
        v.className = "vision";
        v.textContent = extra;
        el.appendChild(v);
      }
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      if (role === "assistant") speak(text);
    }

    function setThinking(on) {
      document.querySelectorAll(".thinking-row").forEach((n) => n.remove());
      if (!on) return;
      const el = document.createElement("div");
      el.className = "thinking-row";
      el.innerHTML = '<span class="dot"></span><span>Thinking</span>';
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    // Procedural amplitude for the speaking pulse — the Web Speech API gives
    // no real audio-amplitude access, so this is an honest, lively rhythm
    // rather than a claim of reading actual TTS output.
    let speakRaf = 0;
    function speak(text) {
      if (!voiceOn || !text || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(String(text).replace(/[`*_#]/g, " ").slice(0, 600));
      utter.rate = 1.02;
      utter.pitch = 1.0;
      utter.volume = 0.96;
      utter.onstart = () => {
        setBlob("speaking");
        const start = performance.now();
        const tick = (now) => {
          const t = (now - start) / 1000;
          const amp = 0.35 + Math.abs(Math.sin(t * 6.5)) * 0.5;
          blobWrap.style.setProperty("--amp", amp.toFixed(3));
          speakRaf = requestAnimationFrame(tick);
        };
        speakRaf = requestAnimationFrame(tick);
      };
      const stopSpeakAnim = () => {
        if (speakRaf) cancelAnimationFrame(speakRaf);
        blobWrap.style.setProperty("--amp", "0");
        setBlob("idle");
        scheduleCollapse();
      };
      utter.onend = stopSpeakAnim;
      utter.onerror = stopSpeakAnim;
      window.speechSynthesis.speak(utter);
    }

    async function submit() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      expand();
      append("user", text);
      setThinking(true);
      setBlob("capturing");
      status.textContent = "Looking at your screen…";
      window.setTimeout(() => setBlob("thinking"), 480);
      try {
        const result = await api.ask(text);
        setThinking(false);
        if (result?.reply?.text) {
          setContext(result?.vision?.summary ? "Screen" : "");
          append("assistant", result.reply.text, result.vision?.summary);
        } else {
          setBlob("error");
          append("assistant", result?.error || "I could not answer that.");
          window.setTimeout(() => setBlob("idle"), 550);
        }
        if (result?.pointer) status.textContent = `Pointing · ${result.pointer.label || "Look here"}`;
        else status.textContent = "Ready · RapidOCR";
        if (!("speechSynthesis" in window) || !voiceOn) scheduleCollapse();
      } catch (error) {
        setThinking(false);
        setBlob("error");
        append("assistant", error?.message || "Something went wrong.");
        window.setTimeout(() => setBlob("idle"), 550);
        scheduleCollapse();
      }
    }

    async function seeScreen() {
      expand();
      setBlob("capturing");
      status.textContent = "Looking at your screen…";
      const result = await api.seeScreen(input.value.trim() || "What is on my screen?");
      setBlob("idle");
      setContext(result?.vision ? "Screen" : "");
      append("assistant", result?.vision?.summary || result?.error || "Captured your screen.", result?.vision?.ocr?.text?.slice?.(0, 240));
      status.textContent = "Ready · RapidOCR";
      scheduleCollapse();
    }

    input.addEventListener("focus", () => { expand(); if (idleTimer) clearTimeout(idleTimer); });
    input.addEventListener("blur", () => scheduleCollapse(4000));
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); void submit(); }
      else if (event.key === "Escape") { input.blur(); collapse(); }
    });
    document.getElementById("seeBtn").addEventListener("click", () => void seeScreen());

    async function startGuide() {
      expand();
      const result = await api.startGuide(input.value.trim() || "Show me where to click");
      controls.classList.add("show");
      controlLabel.textContent = "Guiding — pointing only";
      takeControl.classList.add("hidden");
      resumeAi.classList.add("hidden");
      document.getElementById("guideBtn").classList.add("recording");
      document.getElementById("controlBtn").classList.remove("recording");
      if (result?.pointer) append("assistant", `I'm pointing at "${result.pointer.label}" — look for the blue ring. I haven't clicked anything.`);
      else append("system", result?.error || "Guide mode on — ask me what to highlight.");
    }

    async function startControl() {
      expand();
      await api.startControl();
      controls.classList.add("show");
      controlLabel.textContent = "AI has control";
      takeControl.classList.remove("hidden");
      resumeAi.classList.add("hidden");
      document.getElementById("controlBtn").classList.add("recording");
      document.getElementById("guideBtn").classList.remove("recording");
      setBlob("controlling");
      append("system", "Desktop control armed. I can move and click — Take control anytime to pause me.");
    }

    document.getElementById("guideBtn").addEventListener("click", () => void startGuide());
    document.getElementById("controlBtn").addEventListener("click", () => void startControl());
    document.getElementById("clearBtn").addEventListener("click", () => {
      log.innerHTML = "";
      append("system", "Cleared. Capture is still available.");
    });
    document.getElementById("collapseBtn").addEventListener("click", () => { input.blur(); collapse(); });
    blobWrap.addEventListener("click", () => { input.focus(); expand(); });

    takeControl.addEventListener("click", async () => {
      await api.takeManualControl();
      takeControl.classList.add("hidden");
      resumeAi.classList.remove("hidden");
      controlLabel.textContent = "You have control";
      setBlob("idle");
    });
    resumeAi.addEventListener("click", async () => {
      await api.resumeAi();
      resumeAi.classList.add("hidden");
      takeControl.classList.remove("hidden");
      controlLabel.textContent = "AI has control";
      setBlob("controlling");
    });
    stopControl.addEventListener("click", async () => {
      await api.stopControl();
      controls.classList.remove("show");
      document.getElementById("guideBtn").classList.remove("recording");
      document.getElementById("controlBtn").classList.remove("recording");
      setBlob("idle");
      status.textContent = "Ready · RapidOCR";
    });

    // ---- Real microphone amplitude (push-to-talk via SpeechRecognition) ----
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let meterRaf = 0;

    async function startMeter() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);
        const tick = () => {
          analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          const level = Math.min(1, (sum / data.length / 255) * 3.2);
          blobWrap.style.setProperty("--amp", level.toFixed(3));
          meterRaf = requestAnimationFrame(tick);
        };
        meterRaf = requestAnimationFrame(tick);
      } catch {
        // No mic permission — mic button still works for STT via the browser's
        // own permission prompt; the amplitude meter is a visual bonus only.
      }
    }

    function stopMeter() {
      if (meterRaf) cancelAnimationFrame(meterRaf);
      meterRaf = 0;
      blobWrap.style.setProperty("--amp", "0");
      if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
      if (audioCtx) { void audioCtx.close(); audioCtx = null; }
      analyser = null;
    }

    document.getElementById("micBtn").addEventListener("click", () => {
      if (!SpeechRecognition) {
        append("system", "Speech recognition is not available in this overlay — type instead.");
        return;
      }
      expand();
      if (listening) {
        recognition?.stop();
        return;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = "en-US";
      recognition.onresult = (event) => {
        let text = "";
        for (let i = event.resultIndex; i < event.results.length; i++) text += event.results[i][0].transcript;
        input.value = text.trim();
        if (event.results[event.results.length - 1].isFinal) void submit();
      };
      recognition.onend = () => {
        listening = false;
        document.getElementById("micBtn").classList.remove("recording");
        setBlob("idle");
        stopMeter();
      };
      recognition.start();
      listening = true;
      document.getElementById("micBtn").classList.add("recording");
      setBlob("listening");
      void startMeter();
    });

    if (api?.onState) {
      api.onState((state) => {
        if (state?.status) status.textContent = state.status;
        if (state?.controlling || state?.guiding) {
          controls.classList.add("show");
          controlLabel.textContent = state.manualControl ? "You have control" : state.guiding ? "Guiding — pointing only" : "AI has control";
          if (!state.manualControl) setBlob("controlling");
        } else {
          controls.classList.remove("show");
        }
      });
    }
  </script>
