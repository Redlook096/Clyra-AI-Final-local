<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clyra Companion</title>
  <style>
    /* Light minimal OpenCluely-inspired overlay UI — no stealth. */
    :root {
      --glass: linear-gradient(180deg, rgba(255, 255, 255, 0.94) 0%, rgba(248, 250, 252, 0.92) 100%);
      --glass-deep: #ffffff;
      --line: rgba(15, 23, 42, 0.1);
      --text: #18212f;
      --muted: #8b939e;
      --secondary: #5b6470;
      --green: #10b981;
      --red: #ef4444;
      --blue: #0052fb;
      --stop: #ef4444;
      --black: #171817;
      --surface: #f4f5f7;
      --user-bubble: #eef1f6;
      --hover: #f3f4f6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .stack {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 8px;
      gap: 8px;
    }
    .command-tab {
      height: 36px;
      background: var(--glass);
      backdrop-filter: blur(22px);
      border-radius: 999px;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px;
      -webkit-app-region: drag;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      flex-shrink: 0;
    }
    .command-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      color: var(--secondary);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      border: 0;
      background: transparent;
      -webkit-app-region: no-drag;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .command-item:hover { background: var(--hover); color: var(--text); }
    .command-item.active { color: var(--blue); background: rgba(0, 82, 251, 0.08); }
    .command-item.recording { color: var(--blue); }
    .command-item span.kbd {
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
    }
    .command-separator {
      width: 1px;
      height: 14px;
      margin: 0 4px;
      background: var(--line);
      flex-shrink: 0;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: auto;
      margin-right: 4px;
      flex-shrink: 0;
    }
    .status-dot.on {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    .status-dot.off {
      background: var(--red);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
    }
    .chat-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--glass-deep);
      backdrop-filter: blur(18px);
      border-radius: 16px;
      border: 1px solid var(--line);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.06);
      overflow: hidden;
    }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    .chat-header .title {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .chat-header .sub {
      font-size: 11px;
      color: var(--muted);
      margin-left: 2px;
    }
    .chat-header .spacer { flex: 1; }
    .icon-button {
      -webkit-app-region: no-drag;
      height: 28px;
      min-width: 28px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--secondary);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-button:hover { background: var(--hover); color: var(--text); }
    .log {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-app-region: no-drag;
      background: #fff;
    }
    .message {
      padding: 10px 12px;
      border-radius: 12px;
      border-left: 0;
      background: var(--surface);
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
      color: var(--text);
    }
    .message.user {
      background: var(--user-bubble);
      align-self: flex-end;
      max-width: 92%;
    }
    .message.assistant {
      background: transparent;
      padding-left: 0;
      padding-right: 4px;
      max-width: 96%;
    }
    .message.system {
      background: var(--surface);
      color: var(--secondary);
      font-size: 11.5px;
      align-self: center;
      border-radius: 10px;
    }
    .message .vision {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }
    .thinking {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
    }
    .thinking .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .controls {
      display: none;
      margin: 0 12px 8px;
      height: 34px;
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
      color: var(--text);
      font-size: 11.5px;
      font-weight: 500;
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.1);
      -webkit-app-region: no-drag;
    }
    .controls.show { display: flex; align-items: stretch; }
    .controls .pill {
      display: flex; align-items: center; gap: 8px; padding: 0 12px; flex: 1; min-width: 0;
    }
    .controls .live {
      width: 6px; height: 6px; border-radius: 999px; background: var(--blue);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .controls button {
      border: 0; background: transparent; color: var(--text); padding: 0 12px; cursor: pointer;
      font: inherit; font-size: 11px; font-weight: 600;
      border-left: 1px solid var(--line);
    }
    .controls button:hover { background: var(--hover); }
    .controls button.stop { background: var(--stop); border-left: 0; color: #fff; }
    .controls button.hidden { display: none; }
    .composer {
      border-top: 1px solid var(--line);
      padding: 12px 14px 14px;
      display: grid;
      gap: 8px;
      -webkit-app-region: no-drag;
      background: #fff;
    }
    .mode-row { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--surface); width: fit-content; }
    .chip {
      height: 26px;
      border-radius: 8px;
      border: 0;
      background: transparent;
      color: var(--secondary);
      padding: 0 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip:hover { background: rgba(255,255,255,0.7); color: var(--text); }
    .chip.active {
      color: var(--text);
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 8px 10px;
    }
    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 13.5px;
      line-height: 1.4;
      min-height: 40px;
      max-height: 90px;
    }
    textarea::placeholder { color: var(--muted); }
    .actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .actions .chip {
      border: 1px solid var(--line);
      background: #fff;
    }
    .send {
      margin-left: auto;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 0;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .send:disabled { background: var(--line); color: var(--muted); }
    .hint { font-size: 10px; color: var(--muted); }
    .wave {
      display: none; align-items: center; justify-content: center; gap: 2px; height: 28px; flex: 1;
    }
    .wave.on { display: flex; }
    .wave span {
      width: 2.5px; border-radius: 999px; min-height: 4px;
      background: linear-gradient(180deg, #93c5fd 0%, #0052fb 70%);
    }
  </style>
</head>
<body>
  <div class="stack">
    <div class="command-tab" id="commandTab">
      <button class="command-item" id="seeTab" title="See screen">📷 <span class="kbd">See</span></button>
      <div class="command-separator"></div>
      <button class="command-item" id="micTab" title="Talk">🎙</button>
      <div class="command-separator"></div>
      <button class="command-item" id="guideTab" title="Guide pointer">◎ <span class="kbd">Guide</span></button>
      <div class="command-separator"></div>
      <button class="command-item" id="controlTab" title="Take control">◉ <span class="kbd">Control</span></button>
      <div class="command-separator"></div>
      <button class="command-item" id="hideTab" title="Hide">✕</button>
      <div class="status-dot off" id="statusDot"></div>
    </div>

    <div class="chat-shell">
      <div class="chat-header">
        <span class="title">Clyra Companion</span>
        <span class="sub" id="status">Ready · RapidOCR</span>
        <span class="spacer"></span>
        <button class="icon-button" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="log" id="log">
        <div class="message assistant">Hello — ask what’s on your screen, or say “show me where to click” and I’ll point.</div>
      </div>
      <div class="controls" id="controls">
        <div class="pill"><span class="live"></span><span id="controlLabel">AI has control</span></div>
        <button type="button" id="takeControl">Take control</button>
        <button type="button" id="resumeAi" class="hidden">Resume AI</button>
        <button type="button" class="stop" id="stopControl">Stop</button>
      </div>
      <div class="composer">
        <div class="mode-row">
          <button class="chip active" id="modeTalk" type="button">Talk</button>
          <button class="chip" id="modeMessage" type="button">Message</button>
        </div>
        <div class="row">
          <div class="wave" id="wave" aria-hidden="true"></div>
          <textarea id="input" rows="2" placeholder="Ask about your screen, or how to click something…"></textarea>
        </div>
        <div class="actions">
          <button class="chip" id="see" type="button">See screen</button>
          <button class="chip" id="guide" type="button">Guide me</button>
          <button class="chip" id="control" type="button">Take over</button>
          <button class="send" id="send" disabled title="Send">↑</button>
        </div>
        <div class="hint">⌘⇧J · RapidOCR · Guide points without clicking · Control drives the OS cursor</div>
      </div>
    </div>
  </div>
  <script>
    const api = window.clyraCompanion;
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const statusDot = document.getElementById("statusDot");
    const controls = document.getElementById("controls");
    const controlLabel = document.getElementById("controlLabel");
    const takeControl = document.getElementById("takeControl");
    const resumeAi = document.getElementById("resumeAi");
    const stopControl = document.getElementById("stopControl");
    let listening = false;
    let recognition = null;
    let voiceOn = true;
    let messageMode = false;
    const wave = document.getElementById("wave");
    for (let i = 0; i < 27; i++) {
      const span = document.createElement("span");
      span.style.height = "4px";
      span.style.opacity = "0.35";
      wave.appendChild(span);
    }
    let wavePhase = 0;
    let waveLevel = 0;
    let waveRaf = 0;
    function renderWave(level) {
      waveLevel = Math.max(waveLevel * 0.82, Math.min(1, level || 0));
      const bars = wave.querySelectorAll("span");
      const middle = (bars.length - 1) / 2;
      bars.forEach((bar, index) => {
        const distance = Math.abs(index - middle) / middle;
        const bell = Math.exp(-(distance * distance) * 2.4);
        const waves = (Math.sin(wavePhase + index * 0.38) + Math.sin(wavePhase * 0.6 - index * 0.2) + 2) / 4;
        const height = 3 + bell * (2 + waves * (6 + waveLevel * 20));
        bar.style.height = `${height.toFixed(1)}px`;
        bar.style.opacity = String(0.28 + bell * (0.3 + waveLevel * 0.4));
      });
    }
    function tickWave(now) {
      wavePhase += 0.14;
      renderWave(listening ? 0.25 + Math.sin(now / 180) * 0.15 : 0);
      waveRaf = requestAnimationFrame(tickWave);
    }

    function speak(text) {
      if (messageMode || !voiceOn || !text || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(String(text).replace(/[`*_#]/g, " ").slice(0, 600));
      utter.rate = 1.02;
      utter.pitch = 1.0;
      utter.volume = 0.96;
      window.speechSynthesis.speak(utter);
    }

    function append(role, text, extra) {
      const el = document.createElement("div");
      el.className = `message ${role === "user" ? "user" : role === "system" ? "system" : "assistant"}`;
      el.textContent = text;
      if (extra) {
        const v = document.createElement("div");
        v.className = "vision";
        v.textContent = extra;
        el.appendChild(v);
      }
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      if (role === "assistant") speak(text);
    }

    function setThinking(on) {
      document.querySelectorAll(".thinking").forEach((n) => n.remove());
      if (!on) return;
      const el = document.createElement("div");
      el.className = "thinking";
      el.innerHTML = '<span class="dot"></span><span>Thinking</span>';
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    function syncSend() {
      send.disabled = !input.value.trim();
    }

    function setLive(on) {
      statusDot.classList.toggle("on", on);
      statusDot.classList.toggle("off", !on);
    }

    input.addEventListener("input", syncSend);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        void submit();
      }
    });

    async function submit() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      syncSend();
      append("user", text);
      setThinking(true);
      setLive(true);
      const result = await api.ask(text);
      setThinking(false);
      setLive(false);
      if (result?.reply?.text) append("assistant", result.reply.text, result.vision?.summary);
      else append("assistant", result?.error || "I could not answer that.");
      if (result?.pointer) {
        status.textContent = `Pointing · ${result.pointer.label || "Look here"}`;
      }
    }

    async function seeScreen() {
      setThinking(true);
      setLive(true);
      const result = await api.seeScreen(input.value.trim() || "What is on my screen?");
      setThinking(false);
      setLive(false);
      append("assistant", result?.vision?.summary || result?.error || "Captured your screen.", result?.vision?.ocr?.text?.slice?.(0, 240));
    }

    async function startGuide() {
      const result = await api.startGuide(input.value.trim() || "Show me where to click");
      controls.classList.add("show");
      controlLabel.textContent = "Guiding — pointing only";
      takeControl.classList.add("hidden");
      resumeAi.classList.add("hidden");
      document.getElementById("guideTab").classList.add("active");
      document.getElementById("controlTab").classList.remove("active");
      document.getElementById("guide").classList.add("active");
      document.getElementById("control").classList.remove("active");
      if (result?.pointer) {
        append("assistant", `I'm pointing at “${result.pointer.label}” — look for the blue ring. I haven't clicked anything.`);
      } else {
        append("system", result?.error || "Guide mode on — ask me what to highlight.");
      }
    }

    async function startControl() {
      await api.startControl();
      controls.classList.add("show");
      controlLabel.textContent = "AI has control";
      takeControl.classList.remove("hidden");
      resumeAi.classList.add("hidden");
      document.getElementById("controlTab").classList.add("active");
      document.getElementById("guideTab").classList.remove("active");
      document.getElementById("control").classList.add("active");
      document.getElementById("guide").classList.remove("active");
      append("system", "Desktop control armed. I can move and click — Take control anytime to pause me.");
    }

    send.addEventListener("click", () => void submit());
    document.getElementById("hideTab").addEventListener("click", () => api.hide());
    document.getElementById("clearBtn").addEventListener("click", () => {
      log.innerHTML = "";
      append("system", "Cleared. Capture is still available.");
    });
    document.getElementById("see").addEventListener("click", () => void seeScreen());
    document.getElementById("seeTab").addEventListener("click", () => void seeScreen());
    document.getElementById("guide").addEventListener("click", () => void startGuide());
    document.getElementById("guideTab").addEventListener("click", () => void startGuide());
    document.getElementById("control").addEventListener("click", () => void startControl());
    document.getElementById("controlTab").addEventListener("click", () => void startControl());

    takeControl.addEventListener("click", async () => {
      await api.takeManualControl();
      takeControl.classList.add("hidden");
      resumeAi.classList.remove("hidden");
      controlLabel.textContent = "You have control";
    });
    resumeAi.addEventListener("click", async () => {
      await api.resumeAi();
      resumeAi.classList.add("hidden");
      takeControl.classList.remove("hidden");
      controlLabel.textContent = "AI has control";
    });
    stopControl.addEventListener("click", async () => {
      await api.stopControl();
      controls.classList.remove("show");
      document.getElementById("control").classList.remove("active");
      document.getElementById("guide").classList.remove("active");
      document.getElementById("controlTab").classList.remove("active");
      document.getElementById("guideTab").classList.remove("active");
      status.textContent = "Ready · RapidOCR";
    });

    document.getElementById("modeTalk").addEventListener("click", () => {
      messageMode = false;
      document.getElementById("modeTalk").classList.add("active");
      document.getElementById("modeMessage").classList.remove("active");
    });
    document.getElementById("modeMessage").addEventListener("click", () => {
      messageMode = true;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      document.getElementById("modeMessage").classList.add("active");
      document.getElementById("modeTalk").classList.remove("active");
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    document.getElementById("micTab").addEventListener("click", () => {
      if (!SpeechRecognition) {
        append("system", "Speech recognition is not available in this overlay — type instead.");
        return;
      }
      if (listening) {
        recognition?.stop();
        listening = false;
        document.getElementById("micTab").classList.remove("recording");
        wave.classList.remove("on");
        if (waveRaf) cancelAnimationFrame(waveRaf);
        return;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = "en-US";
      recognition.onresult = (event) => {
        let text = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          text += event.results[i][0].transcript;
        }
        input.value = text.trim();
        syncSend();
        waveLevel = 0.7;
        if (event.results[event.results.length - 1].isFinal) {
          void submit();
        }
      };
      recognition.onend = () => {
        listening = false;
        document.getElementById("micTab").classList.remove("recording");
        wave.classList.remove("on");
        if (waveRaf) cancelAnimationFrame(waveRaf);
      };
      recognition.start();
      listening = true;
      document.getElementById("micTab").classList.add("recording");
      wave.classList.add("on");
      waveRaf = requestAnimationFrame(tickWave);
    });

    if (api?.onState) {
      api.onState((state) => {
        if (state?.status) status.textContent = state.status;
        if (state?.controlling || state?.guiding) {
          controls.classList.add("show");
          controlLabel.textContent = state.manualControl
            ? "You have control"
            : state.guiding
              ? "Guiding — pointing only"
              : "AI has control";
        }
      });
    }
  </script>
</body>
</html>
