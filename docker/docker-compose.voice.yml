services:
  voice-pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.voice
    environment:
      VOICE_SAMPLE_RATE: 16000
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
      FISH_TTS_REFERENCE_ID: ${FISH_TTS_REFERENCE_ID:-}
      FISH_TTS_MODEL: ${FISH_TTS_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MY_LLM_API_KEY: ${MY_LLM_API_KEY:-}
      MY_LLM_BASE_URL: ${MY_LLM_BASE_URL:-https://api.deepseek.com}
      MY_LLM_MODEL: ${MY_LLM_MODEL:-deepseek-v4-flash}
    ports:
      - "8787:8787"
    restart: unless-stopped

  clyra:
    build:
      context: ..
      dockerfile: docker/Dockerfile.clyra
    environment:
      PORT: 3000
      VOICE_PIPELINE_URL: http://voice-pipeline:8787
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
      FISH_TTS_REFERENCE_ID: ${FISH_TTS_REFERENCE_ID:-}
      FISH_TTS_MODEL: ${FISH_TTS_MODEL:-}
    ports:
      - "3000:3000"
    depends_on:
      - voice-pipeline
    restart: unless-stopped
