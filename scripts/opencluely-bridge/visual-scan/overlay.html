<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Clyra Visual Scan</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      pointer-events: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #backdrop {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <img id="backdrop" alt="" />
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d", { alpha: true });
    let raf = 0;

    function roundedRectPath(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function perimeter(w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      return 2 * (w + h) - 8 * radius + 2 * Math.PI * radius;
    }

    window.__runVisualScan = function runVisualScan(scene) {
      cancelAnimationFrame(raf);
      const backdrop = document.getElementById("backdrop");
      const hasBackdrop = Boolean(scene.backdropPath || scene.backdropDataUrl);
      if (hasBackdrop && backdrop) {
        try {
          if (scene.backdropPath && typeof require === "function") {
            const fs = require("fs");
            const buf = fs.readFileSync(scene.backdropPath);
            backdrop.src = "data:image/png;base64," + buf.toString("base64");
          } else if (scene.backdropDataUrl) {
            backdrop.src = scene.backdropDataUrl;
          }
          backdrop.style.display = "block";
        } catch (e) {
          console.warn("backdrop load failed", e);
          backdrop.style.display = "none";
        }
      } else if (backdrop) {
        backdrop.removeAttribute("src");
        backdrop.style.display = "none";
      }
      const dpr = Math.min(window.devicePixelRatio || scene.scale || 1, 2);
      const W = scene.width;
      const H = scene.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const reduce =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const duration = reduce ? 900 : scene.durationMs || 1650;
      const origin = scene.origin || { x: W / 2, y: H / 2 };
      const maxRadius = scene.maxRadius || Math.hypot(W / 2, H / 2) * 1.05;
      const elements = (scene.elements || []).map((el) => ({
        ...el,
        peri: perimeter(el.frame.w, el.frame.h, el.cornerRadius || 10),
      }));

      const start = performance.now();

      function frame(now) {
        const elapsed = now - start;
        const t = Math.min(1, elapsed / duration);
        // Soft ease-out — wave feels calm, not linear
        const eased = 1 - Math.pow(1 - t, 1.45);
        const radius = eased * maxRadius;

        ctx.clearRect(0, 0, W, H);

        // Centre pulse (0–140ms)
        if (elapsed < 150) {
          const p = Math.min(1, elapsed / 140);
          const glow = 4 + p * 14;
          const alpha = (1 - p * 0.85) * 0.5;
          const g = ctx.createRadialGradient(origin.x, origin.y, 0, origin.x, origin.y, glow);
          g.addColorStop(0, `rgba(255,255,255,${0.62 * alpha})`);
          g.addColorStop(0.4, `rgba(225,238,255,${0.26 * alpha})`);
          g.addColorStop(1, "rgba(195,220,255,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, glow, 0, Math.PI * 2);
          ctx.fill();
        }

        // Narrow luminous radial band (not a thick radar / concentric HUD)
        if (!reduce && elapsed > 90) {
          const bandBoost = hasBackdrop ? 1.35 : 1;
          // Single sharp core + one soft feather — avoid double rings
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, Math.max(0.5, radius), 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(245,248,255,${0.14 * bandBoost})`;
          ctx.lineWidth = 1.15;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, Math.max(0.5, radius - 1.2), 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(225,238,255,${0.06 * bandBoost})`;
          ctx.lineWidth = 3.5;
          ctx.stroke();
          // Optional micro-ripple ~50ms behind
          const r2 = Math.max(0.5, radius - maxRadius * 0.04);
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, r2, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(195,220,255,${0.03 * bandBoost})`;
          ctx.lineWidth = 8;
          ctx.stroke();
        }

        // Contour traces — draw as wave reaches each element
        for (const el of elements) {
          const delta = radius - (el.activationRadius || 0);
          if (delta < 0) continue;
          const hierarchyDelay = (el.hierarchyDepth || 0) * 7;
          const local = delta - hierarchyDelay;
          if (local < 0) continue;

          const pxPerMs = maxRadius / duration;
          const traceMs = Math.min(280, Math.max(140, el.peri * 0.11));
          const drawT = Math.min(1, local / (traceMs * pxPerMs));
          const fadeStart = traceMs * pxPerMs;
          const fadeT =
            local > fadeStart
              ? Math.min(1, (local - fadeStart) / (220 * pxPerMs))
              : 0;
          if (fadeT >= 1) continue;

          let base = 0.22;
          if ((el.importance || 0) >= 0.95) base = 0.42;
          else if ((el.importance || 0) >= 0.5) base = 0.28;
          else if ((el.importance || 0) >= 0.35) base = 0.18;

          if (reduce) {
            // Soft highlight only
            const opacity = base * 0.55 * (1 - fadeT);
            const f = el.frame;
            ctx.save();
            roundedRectPath(ctx, f.x, f.y, f.w, f.h, el.cornerRadius || 10);
            ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
            continue;
          }

          const opacity = base * (0.3 + 0.7 * drawT) * (1 - fadeT);
          const distFront = Math.abs(local);
          const waveBoost = Math.exp(-(distFront * distFront) / 1100) * 0.18;

          const f = el.frame;
          ctx.save();
          roundedRectPath(ctx, f.x, f.y, f.w, f.h, el.cornerRadius || 10);
          ctx.setLineDash([el.peri]);
          ctx.lineDashOffset = el.peri * (1 - drawT);
          // Slightly stronger on Linux snapshot path so the effect reads on busy wallpapers.
          const boost = hasBackdrop ? 1.25 : 1;
          ctx.strokeStyle = `rgba(255,255,255,${Math.min(0.62, (opacity + waveBoost) * boost)})`;
          ctx.lineWidth = 1.15;
          ctx.shadowColor = `rgba(195,220,255,${0.22 * opacity * boost})`;
          ctx.shadowBlur = 7;
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = `rgba(225,238,255,${0.14 * opacity * boost})`;
          ctx.lineWidth = 3.2;
          ctx.stroke();
          ctx.restore();
        }

        if (t < 1) {
          raf = requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, W, H);
        }
      }

      raf = requestAnimationFrame(frame);
    };
  </script>
</body>
</html>
