<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Select screen area</title>
    <style>
      html,body { margin:0; width:100%; height:100%; overflow:hidden; cursor:crosshair; background:transparent; user-select:none; }
      #shade { position:fixed; inset:0; background:rgba(8,17,30,.14); pointer-events:none; }
      #selection { position:fixed; display:none; border:1px solid rgba(255,255,255,.98); box-shadow:0 0 0 1px rgba(10,132,255,.9), 0 0 0 9999px rgba(8,17,30,.20); border-radius:5px; pointer-events:none; }
      #label { position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:8px 12px; border-radius:10px; background:rgba(250,251,253,.88); backdrop-filter:blur(16px); color:#172033; font:500 13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif; box-shadow:0 8px 22px rgba(7,18,36,.15); pointer-events:none; }
      kbd { color:#687386; font-size:11px; margin-left:5px; }
    </style>
  </head>
  <body>
    <div id="shade"></div><div id="selection"></div><div id="label">Drag to select an area <kbd>Esc to cancel</kbd></div>
    <script>
      (() => {
        const selection = document.getElementById('selection'); let start = null;
        const rect = (a,b) => ({ x: Math.min(a.x,b.x), y: Math.min(a.y,b.y), width: Math.abs(b.x-a.x), height: Math.abs(b.y-a.y) });
        const draw = (r) => { selection.style.display='block'; Object.assign(selection.style,{left:r.x+'px',top:r.y+'px',width:r.width+'px',height:r.height+'px'}); };
        addEventListener('pointerdown', (e) => { start={x:e.clientX,y:e.clientY}; document.body.setPointerCapture?.(e.pointerId); draw({x:start.x,y:start.y,width:0,height:0}); });
        addEventListener('pointermove', (e) => { if(start) draw(rect(start,{x:e.clientX,y:e.clientY})); });
        addEventListener('pointerup', (e) => { if(!start) return; const r=rect(start,{x:e.clientX,y:e.clientY}); start=null; if(r.width>=12&&r.height>=12) window.electronAPI?.completeRegionSelection?.(r); else window.electronAPI?.cancelRegionSelection?.(); });
        addEventListener('keydown', (e) => { if(e.key==='Escape') window.electronAPI?.cancelRegionSelection?.(); });
      })();
    </script>
  </body>
</html>
