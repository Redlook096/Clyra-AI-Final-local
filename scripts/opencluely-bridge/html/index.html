<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light" />
  <title>Clyra</title>
  <style>
    :root { --ink:#12213a; --muted:#7f90aa; --line:rgba(54,75,109,.13); --blue:#2588ff; --blue-soft:rgba(44,139,255,.10); --surface:rgba(255,255,255,.90); --ease:cubic-bezier(.22,1,.36,1); --shadow:0 18px 42px rgba(35,57,91,.12),0 3px 10px rgba(35,57,91,.055); }
    * { box-sizing:border-box } html,body { width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--ink);font:14px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased }
    button,input,textarea { font:inherit } button { color:inherit } button:focus-visible,input:focus-visible,textarea:focus-visible { outline:2px solid rgba(37,136,255,.55);outline-offset:2px }
    .shell { width:100%;height:100%;overflow:visible;border-radius:29px;background:transparent;transition:height 320ms var(--ease),width 320ms var(--ease),transform 180ms var(--ease),opacity 160ms ease,border-radius 260ms var(--ease); }
    .shell[data-expanded="true"] { background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(1.1); }
    .bar { position:relative;isolation:isolate;min-height:56px;display:flex;align-items:center;gap:7px;padding:7px 9px 7px 11px;border:1px solid rgba(76,99,132,.12);border-radius:28px;background:linear-gradient(115deg,rgba(255,255,255,.91),rgba(244,249,255,.80));box-shadow:0 8px 24px rgba(38,59,91,.12),inset 0 1px rgba(255,255,255,.96);backdrop-filter:blur(22px) saturate(1.13);-webkit-app-region:drag; }
    .shell[data-expanded="true"] .bar { border:0;border-bottom:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:none;background:transparent; }
    .orb { --orb-level:.12;position:relative;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:0 0 auto;overflow:visible;isolation:isolate;box-shadow:0 0 calc(6px + var(--orb-level)*10px) rgba(52,146,255,.42),inset 0 0 0 1px rgba(255,255,255,.92); }
    .orb:before,.orb:after,.orb i { content:"";position:absolute;border-radius:50%;pointer-events:none }.orb:before { inset:2px;background:radial-gradient(circle at 38% 32%,#e9fbff 0 7%,#9fe1ff 18%,#278aff 46%,#1251dc 72%,#5cc6ff 100%);transform:scale(calc(.93 + var(--orb-level)*.07));transition:transform 80ms linear }.orb:after { inset:-6px;background:radial-gradient(circle,rgba(57,154,255,.32),rgba(96,186,255,.08) 48%,transparent 70%);z-index:-1;opacity:calc(.42 + var(--orb-level)*.54) }.orb i { width:9px;height:7px;top:5px;left:6px;background:rgba(255,255,255,.78);filter:blur(1px);transform:rotate(-24deg) }.orb.thinking:before { animation:orb-flow 1.6s ease-in-out infinite }.orb.listening:before,.orb.speaking:before { animation:orb-breathe 460ms ease-in-out infinite alternate } @keyframes orb-flow{50%{filter:hue-rotate(15deg) saturate(1.18);transform:scale(.94) rotate(12deg)}}@keyframes orb-breathe{to{transform:scale(calc(.94 + var(--orb-level)*.11));filter:saturate(1.24) brightness(1.1)}}
    .bar-copy { min-width:0;flex:1;display:flex;align-items:center;gap:8px;-webkit-app-region:no-drag }.bar-copy[hidden],.bar-title[hidden]{display:none}.bar-copy input { width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;font-weight:450;letter-spacing:-.012em;padding:0; } .bar-copy input::placeholder { color:#8a99ae }.bar-title { min-width:0;flex:1;font-size:13.5px;font-weight:600;color:#274365;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-app-region:no-drag }
    .icon,.send,.round-action { display:grid;place-items:center;border:0;background:transparent;cursor:pointer;-webkit-app-region:no-drag;transition:transform 110ms var(--ease),background-color 130ms ease,color 130ms ease,opacity 130ms ease }.icon { width:32px;height:32px;border-radius:11px;color:#365572 }.icon:hover,.round-action:hover { background:rgba(43,71,104,.065);color:#183959 }.icon:active,.send:active,.round-action:active { transform:scale(.97) }.icon.active{background:rgba(37,136,255,.11);color:#0a75ee}.icon svg,.send svg { width:17px;height:17px }.send { width:32px;height:32px;border-radius:11px;background:linear-gradient(145deg,#5da8ff,#197df1);color:#fff;box-shadow:0 3px 8px rgba(32,131,249,.26) }.send[hidden],.icon[hidden] { display:none }.stop-dot { width:10px;height:10px;border-radius:3px;background:#314968 }
    .panel { display:none;min-height:0;flex:1;flex-direction:column }.shell[data-expanded="true"] .panel { display:flex }.response { min-height:0;overflow:auto;padding:14px 15px 5px;scrollbar-width:thin }.identity { display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;color:#1d3556;margin-bottom:8px }.identity[hidden]{display:none}.identity .orb { width:21px;height:21px }.identity .orb:before{inset:2px}.identity .orb i{width:7px;height:5px;top:4px;left:5px}.response-text { white-space:pre-wrap;color:#1a2d49;line-height:1.46;letter-spacing:-.007em }.response-text.streaming:after { content:"";display:inline-block;width:5px;height:14px;margin-left:3px;vertical-align:-2px;background:#52a1ff;animation:caret .8s step-end infinite }@keyframes caret{50%{opacity:0}}
    .status-row { display:none;align-items:center;gap:10px;padding:12px 15px 3px;color:#71829c;font-size:13px }.status-row.show { display:flex }.micro-wave { display:flex;align-items:center;height:18px;gap:2px }.micro-wave i { display:block;width:2px;height:4px;border-radius:4px;background:#53a3ff;transition:height 70ms linear }.status-row .dots { margin-left:auto;letter-spacing:2px;color:#6d84a4 }
    .action-row { display:none;gap:7px;align-items:center;padding:10px 15px 12px }.action-row.show { display:flex }.chip { border:0;border-radius:999px;padding:6px 11px;background:rgba(232,241,252,.8);color:#18385e;font-size:12px;line-height:1;cursor:pointer;white-space:nowrap;transition:background 120ms ease,transform 120ms ease }.chip:hover { background:#dfedff }.chip:active { transform:scale(.98) }.chip.more { margin-left:auto;padding-inline:8px }
    .attachment { display:none;align-items:center;gap:7px;margin:2px 12px 8px;padding:5px 8px;border-radius:9px;background:#f2f7ff;border:1px solid rgba(37,136,255,.16);color:#3c5578;font-size:11.5px }.attachment.show { display:flex }.attachment img { width:26px;height:20px;object-fit:cover;border-radius:4px }.attachment b { font-weight:600 }.attachment button { margin-left:auto;border:0;background:transparent;color:#6781a1;cursor:pointer;font-size:17px;line-height:1 }
    .composer-wrap { padding:8px 10px 10px;border-top:1px solid var(--line) }.composer { display:flex;align-items:flex-end;gap:6px;min-height:37px;padding:4px 4px 4px 7px;border:1px solid rgba(68,91,127,.14);border-radius:12px;background:rgba(249,252,255,.78);box-shadow:inset 0 1px rgba(255,255,255,.72) }.composer:focus-within { border-color:rgba(37,136,255,.44);box-shadow:0 0 0 3px rgba(37,136,255,.08) }.composer textarea { min-height:19px;max-height:92px;flex:1;resize:none;border:0;outline:0;background:transparent;padding:5px 3px;color:var(--ink);line-height:1.35 }.composer textarea::placeholder { color:#91a0b5 }.composer .icon { color:#6782a5;width:27px;height:27px }
    .control { display:none;flex-direction:column;gap:3px;padding:9px 12px 2px;border-bottom:1px solid var(--line) }.control.show { display:flex }.control-line { display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;color:#244264 }.control-line .orb { width:23px;height:23px }.control-line .orb:before{inset:2px}.control-line .orb i{width:7px;height:5px;top:4px;left:5px}.control-title { min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap }.control-time { color:#7084a4;font-variant-numeric:tabular-nums;font-size:11.5px }.control-action { padding-left:31px;color:#7890ad;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }.compact-control .panel { display:none!important }.compact-control .bar-copy { display:none }.compact-control .bar { gap:8px }.compact-control .bar:after { content:attr(data-control);min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#284566;font-size:12.5px;-webkit-app-region:no-drag }.compact-control .bar .icon { display:none }.compact-control .bar #pauseControl,.compact-control .bar #stopControl{display:grid}
    .menu { position:fixed;z-index:10;display:none;width:226px;padding:6px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.965);box-shadow:0 18px 38px rgba(35,57,91,.16);backdrop-filter:blur(20px);transform-origin:top left;animation:menu-in 195ms var(--ease) }.menu.show { display:block } @keyframes menu-in { from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none} }.menu.right { right:7px;top:60px;transform-origin:top right }.menu.screen-menu{right:76px}.menu.left { left:8px;bottom:62px;transform-origin:bottom left }.menu-title{padding:6px 9px 4px;color:#8191a8;font-size:10px;font-weight:700;letter-spacing:.055em;text-transform:uppercase}.menu-separator{height:1px;margin:5px 7px;background:rgba(62,83,115,.09)}.menu button{display:flex;align-items:center;gap:9px;width:100%;min-height:35px;border:0;border-radius:9px;padding:7px 9px;background:transparent;text-align:left;cursor:pointer;color:#183454;font-size:12.5px;transition:background-color 120ms ease,transform 100ms ease}.menu button:hover,.menu button[aria-selected="true"]{background:#edf5ff}.menu button:active{transform:scale(.985)}.menu svg{width:16px;height:16px;color:#607896;flex:none}.menu small,.menu kbd{margin-left:auto;color:#8b9bb1;font-size:10.5px}.menu kbd{font-family:inherit}
    .bar:before{content:"";position:absolute;z-index:-1;inset:-1px;padding:1.2px;border-radius:inherit;background:conic-gradient(from 0deg,transparent 0 58%,rgba(29,126,255,.08) 66%,rgba(111,195,255,.8) 75%,rgba(255,255,255,.96) 79%,rgba(27,112,255,.62) 84%,transparent 92%);opacity:0;pointer-events:none;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transform-origin:center}.shell[data-state="THINKING"] .bar:before,.shell[data-state="CONTROLLING"] .bar:before,.shell[data-state="LISTENING"] .bar:before,.shell[data-state="SPEAKING"] .bar:before{opacity:1;animation:edge-route 2.45s linear infinite}.shell[data-state="LISTENING"] .bar:before,.shell[data-state="SPEAKING"] .bar:before{filter:brightness(calc(1 + var(--audio-level,0)*.55));animation-duration:1.95s}@keyframes edge-route{to{transform:rotate(1turn)}}.shell[data-state="THINKING"] .bar-title,.shell[data-state="CAPTURING_SCREEN"] .bar-title{color:transparent;background:linear-gradient(100deg,#6f83a0 25%,#f6fbff 45%,#50a5ff 52%,#7588a3 70%);background-size:240% 100%;background-clip:text;-webkit-background-clip:text;animation:text-shimmer 1.75s linear infinite}@keyframes text-shimmer{to{background-position:-140% 0}}
    #closeButton{opacity:.46}#closeButton:hover{opacity:1}.shell[data-state="THINKING"] .icon,.shell[data-state="CAPTURING_SCREEN"] .icon{opacity:.62}
    .confirm { display:none;position:absolute;inset:0;z-index:12;align-items:center;justify-content:center;background:rgba(244,248,254,.58);backdrop-filter:blur(4px) }.confirm.show { display:flex }.confirm-card { width:326px;padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.96);box-shadow:var(--shadow) }.confirm-title { display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:#1b3455 }.confirm-title .orb { width:22px;height:22px }.confirm-title .orb:before{inset:2px}.confirm-title .orb i{width:7px;height:5px;top:4px;left:5px}.confirm-card p { margin:8px 0 12px;color:#647a99;font-size:12px;line-height:1.4 }.confirm-actions { display:flex;gap:7px;justify-content:flex-end }.confirm-actions button { border:0;border-radius:9px;padding:6px 10px;background:#edf3fb;color:#274666;cursor:pointer;font-size:11.5px }.confirm-actions .primary { background:#2c87fa;color:white;box-shadow:0 3px 8px rgba(35,133,247,.23) }
    .voice-call { display:none;padding:12px 14px 11px }.voice-call.show { display:block;animation:voice-in 220ms var(--ease) both }@keyframes voice-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}.voice-head { display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650 }.voice-head .orb { width:24px;height:24px }.voice-head .orb:before{inset:2px}.voice-head .orb i{width:7px;height:5px;top:4px;left:5px}.voice-head time{margin-left:auto;color:#7f90aa;font-weight:500;font-variant-numeric:tabular-nums}.voice-wave { height:38px;display:flex;justify-content:center;align-items:center;gap:2px;margin:8px 0 9px }.voice-wave i { width:2px;height:4px;background:#59a7ff;border-radius:3px;transition:height 70ms linear }.voice-actions { display:flex;justify-content:space-around;border-top:1px solid rgba(54,75,109,.08);padding-top:7px }.voice-actions button { border:0;background:transparent;color:#315474;font-size:10px;cursor:pointer;display:grid;gap:2px;place-items:center }.voice-actions button svg{width:15px;height:15px}.voice-actions .end { color:#e84e58 }
    /* Compact state refinements. These override the original bridge shell so
       the same physical surface stays crisp in every state. */
    .bar{border-color:rgba(76,99,132,.11);background:linear-gradient(115deg,rgba(255,255,255,.91),rgba(246,250,255,.80));box-shadow:0 6px 18px rgba(38,59,91,.095),inset 0 1px rgba(255,255,255,.96)}
    .bar:focus-within{border-color:rgba(37,136,255,.26);box-shadow:0 6px 18px rgba(38,59,91,.105),0 0 0 3px rgba(37,136,255,.06),inset 0 1px rgba(255,255,255,.96)}
    .orb{box-shadow:0 0 calc(4px + var(--orb-level)*7px) rgba(52,146,255,.33),inset 0 0 0 1px rgba(255,255,255,.92)}.orb:after{inset:-4px;background:radial-gradient(circle,rgba(57,154,255,.28),rgba(96,186,255,.06) 52%,transparent 72%);opacity:calc(.32 + var(--orb-level)*.48)}
    .response{padding:12px 14px 4px}.response-text{font-size:14px;line-height:1.47}.action-row{gap:6px;padding:8px 14px 10px}.chip{padding:5px 9px;background:rgba(232,241,252,.72);font-size:11.5px}
    .shell[data-expanded="true"] .control.show .control-line{display:none}.shell[data-expanded="true"] .control.show .control-action{padding-left:0}.compact-control .bar-title{display:none!important}.control{padding:8px 12px 3px}
    .menu{width:218px;padding:5px;border-radius:13px;box-shadow:0 14px 30px rgba(35,57,91,.13)}.menu-title{padding:5px 8px 3px}.menu-separator{margin:4px 7px}.menu button{min-height:32px;border-radius:8px;padding:6px 8px;font-size:12px}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.bar:before{display:none}}
    @media (prefers-contrast:more){.bar,.shell[data-expanded="true"]{background:#fff;border-color:rgba(19,40,68,.35);backdrop-filter:none}}
  </style>
</head>
<body>
  <main id="shell" class="shell" data-expanded="false" data-state="IDLE" aria-label="Clyra screen intelligence">
    <header id="bar" class="bar">
      <span id="orb" class="orb" aria-hidden="true"><i></i></span>
      <label class="bar-copy"><input id="quickInput" aria-label="Ask Clyra" autocomplete="off" placeholder="Ask Clyra or type a task…" /></label><span id="barTitle" class="bar-title" hidden>Clyra</span>
      <button id="screenButton" class="icon" aria-label="Screen intelligence" title="Screen"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="12.5" rx="2.4" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 20h7M12 17v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <button id="voiceButton" class="icon" aria-label="Start voice call" title="Voice call"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0v-5a3 3 0 0 0-3-3Z" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button id="plusButton" class="icon" aria-label="Clyra actions" title="Actions"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button id="closeButton" class="icon" aria-label="Close OpenCluely" title="Close OpenCluely"><svg viewBox="0 0 24 24" fill="none"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button id="quickSend" class="send" aria-label="Send request" hidden><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="moreButton" class="icon" aria-label="More Clyra actions" title="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.55"/><circle cx="12" cy="12" r="1.55"/><circle cx="19" cy="12" r="1.55"/></svg></button>
      <button id="pauseControl" class="icon" aria-label="Pause Clyra" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.2" height="14" rx="1"/><rect x="13.8" y="5" width="3.2" height="14" rx="1"/></svg></button>
      <button id="stopControl" class="icon" aria-label="Stop Clyra" hidden><span class="stop-dot"></span></button>
    </header>
    <section id="panel" class="panel" aria-live="polite">
      <div id="controlCapsule" class="control"><div class="control-line"><span class="orb" aria-hidden="true"><i></i></span><span id="controlState" class="control-title">Controlling · Working…</span><time id="controlTime" class="control-time">0:00</time><button id="controlMenuButton" class="icon" aria-label="Control actions"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.55"/><circle cx="12" cy="12" r="1.55"/><circle cx="19" cy="12" r="1.55"/></svg></button></div><div id="controlAction" class="control-action">Observing the screen…</div></div>
      <div id="statusRow" class="status-row"><div id="microWave" class="micro-wave" aria-hidden="true"></div><span id="statusText">Thinking…</span><span id="statusDots" class="dots">•••</span></div>
      <div id="response" class="response"><div id="identity" class="identity" hidden><span class="orb" aria-hidden="true"><i></i></span><span>Clyra</span></div><div id="responseText" class="response-text"></div></div>
      <div id="quickActions" class="action-row"></div>
      <div id="attachment" class="attachment"></div>
      <div id="composerWrap" class="composer-wrap"><div class="composer"><button id="addButton" class="icon" aria-label="Add context" title="Add context"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><textarea id="composer" rows="1" aria-label="Ask Clyra" placeholder="Ask a follow-up…"></textarea><button id="sendButton" class="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
    </section>
    <section id="voiceView" class="voice-call"><div class="voice-head"><span class="orb listening" aria-hidden="true"><i></i></span><span id="voiceState">Listening…</span><time id="voiceTime">00:00</time><button id="endVoice" class="icon end" aria-label="End voice call">×</button></div><div id="wave" class="voice-wave" aria-label="Live microphone level"></div><div class="voice-actions"><button id="muteVoice" aria-label="Mute microphone"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0v-5a3 3 0 0 0-3-3Z" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7" stroke="currentColor" stroke-width="1.8"/></svg><span>Mute</span></button><button id="voiceScreen" aria-label="Attach screen"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8" stroke="currentColor" stroke-width="1.8"/></svg><span>Screen</span></button><button id="endVoiceFooter" class="end" aria-label="End voice call"><svg viewBox="0 0 24 24" fill="none"><path d="M6.5 5.5c1.3 2.8 3.2 5 5.9 6.7l2-2a1 1 0 0 1 1-.26c1.1.3 2.2.4 3.3.4a1 1 0 0 1 1 1v3.2a1 1 0 0 1-1 1C11 15.5 4.5 9 4.5 1.2a1 1 0 0 1 1-1h3.2a1 1 0 0 1 1 1c0 1.1.1 2.2.4 3.3a1 1 0 0 1-.26 1Z" transform="rotate(132 12 12)" stroke="currentColor" stroke-width="1.5"/></svg><span>End</span></button></div></section>
    <aside id="screenMenu" class="menu right screen-menu" role="menu" aria-label="Screen actions"><div class="menu-title">Screen intelligence</div><button data-action="screen"><span>Ask about screen</span></button><button data-action="capture"><span>Capture screen</span></button><button data-action="window"><span>Share current window</span></button><div class="menu-separator"></div><button data-action="control"><span>Take control</span></button></aside>
    <aside id="addMenu" class="menu right" role="menu" aria-label="Clyra actions"><div class="menu-title">Add</div><button data-action="attach-image"><span>Attach image</span></button><button data-action="attach-file"><span>Attach file</span></button><button data-action="area"><span>Select screen area</span></button><div class="menu-separator"></div><div class="menu-title">Intelligence</div><button data-action="screen"><span>Ask about screen</span></button><button data-action="search"><span>Search the web</span></button><button data-action="voice"><span>Voice conversation</span></button><button data-action="control"><span>Take control</span></button><div class="menu-separator"></div><button data-action="create-task"><span>Create task</span></button><button data-action="open-chat"><span>Open Clyra chat</span></button></aside>
    <aside id="commandMenu" class="menu left" role="menu"><div class="menu-title">Commands</div><button data-command="screen"><span>Ask about screen</span><kbd>/screen</kbd></button><button data-command="select"><span>Select area</span><kbd>/select</kbd></button><button data-command="voice"><span>Voice call</span><kbd>/voice</kbd></button><button data-command="control"><span>Take control</span><kbd>/control</kbd></button></aside>
    <aside id="controlMenu" class="menu right" role="menu"><button id="controlPause">Pause</button><button id="controlTakeover">Take over</button><button id="controlContinue">Continue</button><button id="controlStop">Stop</button></aside>
    <div id="confirm" class="confirm"><div class="confirm-card"><div class="confirm-title"><span class="orb" aria-hidden="true"><i></i></span><span>Clyra wants to interact</span></div><p id="confirmText">Clyra can navigate and type for this task. You can pause or stop it at any time.</p><div class="confirm-actions"><button id="cancelControl">Deny</button><button id="approveControl" class="primary">Allow once</button></div></div></div>
    <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
    <input id="fileInput" type="file" accept=".txt,.md,.markdown,.json,.csv,.js,.jsx,.ts,.tsx,.html,.css,.xml,.yaml,.yml,.log" hidden />
  </main>
  <script src="./src/ui/bar-chat.js"></script>
