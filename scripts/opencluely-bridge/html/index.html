<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OpenCluely</title>
    <link href="./dist/output.css" rel="stylesheet" />
    <link href="./src/styles/common.css" rel="stylesheet" />
    <style>
      :root {
        --oc-glass: rgba(246, 247, 249, 0.78);
        --oc-glass-open: rgba(255, 255, 255, 0.88);
        --oc-border: rgba(15, 23, 42, 0.08);
        --oc-text: #3a4556;
        --oc-text-strong: #1f2937;
        --oc-shadow: 0 10px 28px rgba(15, 23, 42, 0.12), 0 2px 6px rgba(15, 23, 42, 0.06);
        --oc-btn-bg: #ffffff;
        --oc-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --oc-collapsed-w: auto;
        --oc-expanded-w: 400px;
        --oc-bar-h: 52px;
        --oc-drawer-h: 360px;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: fit-content;
        height: fit-content;
        background: transparent !important;
        overflow: hidden;
        font-family: "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-app-region: no-drag;
      }

      .oc-shell {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        width: max-content;
        min-width: 220px;
        background: transparent;
        border-radius: 999px;
        overflow: hidden;
        transition:
          width 380ms var(--oc-ease),
          border-radius 380ms var(--oc-ease),
          background 320ms ease,
          box-shadow 320ms ease,
          border-color 320ms ease;
      }

      .oc-shell.is-wide,
      .oc-shell.is-chat-open {
        width: var(--oc-expanded-w);
        border-radius: 18px;
        background: var(--oc-glass-open);
        border: 1px solid var(--oc-border);
        box-shadow: var(--oc-shadow);
        backdrop-filter: blur(22px) saturate(1.15);
        -webkit-backdrop-filter: blur(22px) saturate(1.15);
      }

      .oc-shell.is-chat-open {
        border-radius: 18px;
      }

      /* Collapsed frosted pill */
      .command-tab {
        height: var(--oc-bar-h);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px 0 8px;
        width: max-content;
        min-width: 220px;
        background: var(--oc-glass);
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 999px;
        box-shadow: var(--oc-shadow);
        backdrop-filter: blur(24px) saturate(1.2);
        -webkit-backdrop-filter: blur(24px) saturate(1.2);
        -webkit-app-region: drag;
        transition:
          width 380ms var(--oc-ease),
          border-radius 380ms var(--oc-ease),
          background 320ms ease,
          box-shadow 320ms ease,
          border-color 320ms ease,
          opacity 280ms ease;
      }

      .oc-shell.is-wide .command-tab,
      .oc-shell.is-chat-open .command-tab {
        width: 100%;
        min-width: 0;
        border-radius: 18px 18px 0 0;
        background: transparent;
        border: none;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .oc-shell.is-chat-open .command-tab {
        border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      }

      .oc-close {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        border: none;
        background: #fff;
        color: #5b6575;
        display: inline-grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.10);
        -webkit-app-region: no-drag;
        transition: transform 180ms var(--oc-ease), background 180ms ease, color 180ms ease;
        flex-shrink: 0;
      }
      .oc-close:hover {
        background: #f3f4f6;
        color: #111827;
        transform: scale(1.04);
      }
      .oc-close svg { width: 12px; height: 12px; }

      .oc-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        -webkit-app-region: no-drag;
      }

      .oc-pill-btn {
        height: 34px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        background: var(--oc-btn-bg);
        color: var(--oc-text);
        font-size: 13px;
        font-weight: 550;
        letter-spacing: -0.01em;
        cursor: pointer;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        transition: transform 180ms var(--oc-ease), background 180ms ease, box-shadow 180ms ease, color 180ms ease;
        white-space: nowrap;
      }
      .oc-pill-btn:hover {
        background: #fafbfc;
        color: var(--oc-text-strong);
        transform: translateY(-0.5px);
        box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
      }
      .oc-pill-btn:active { transform: translateY(0); }
      .oc-pill-btn.is-active {
        background: #f3f4f6;
        color: var(--oc-text-strong);
        border-color: rgba(15, 23, 42, 0.14);
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
      }

      .oc-drag {
        width: 28px;
        height: 34px;
        border-radius: 10px;
        border: none;
        background: transparent;
        color: #9aa3b2;
        display: inline-grid;
        place-items: center;
        cursor: grab;
        -webkit-app-region: drag;
        flex-shrink: 0;
        transition: color 160ms ease, background 160ms ease;
      }
      .oc-drag:hover { color: #6b7280; background: rgba(255,255,255,0.55); }
      .oc-drag:active { cursor: grabbing; }
      .oc-drag-dots {
        display: grid;
        grid-template-columns: repeat(2, 3px);
        gap: 3px;
      }
      .oc-drag-dots span {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: currentColor;
      }

      /* Chat drawer — light theme, expands down after width */
      .chat-drawer {
        width: 100%;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        pointer-events: none;
        transition:
          max-height 420ms var(--oc-ease),
          opacity 280ms ease;
      }

      .oc-shell.is-chat-open .chat-drawer {
        max-height: var(--oc-drawer-h);
        opacity: 1;
        pointer-events: auto;
      }

      .chat-drawer-inner {
        height: calc(var(--oc-drawer-h) - 8px);
        display: flex;
        flex-direction: column;
        background: transparent;
        -webkit-app-region: no-drag;
      }

      .chat-drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px 6px;
        color: var(--oc-text-strong);
        font-size: 12px;
        font-weight: 600;
      }

      .chat-drawer-header .hint {
        color: #8b95a5;
        font-weight: 500;
        font-size: 11px;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 6px 14px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Override legacy dark-theme common.css message colors for light drawer */
      .chat-messages .message {
        max-width: 92%;
        margin-bottom: 0;
        padding: 9px 11px;
        border-radius: 12px;
        border-left: none;
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--oc-text-strong) !important;
        background: rgba(255, 255, 255, 0.82) !important;
        border: 1px solid rgba(15, 23, 42, 0.06);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        backdrop-filter: none;
        text-shadow: none;
      }
      .chat-messages .message.user {
        align-self: flex-end;
        background: #e8eef8 !important;
        border-color: rgba(55, 65, 81, 0.12);
        color: var(--oc-text-strong) !important;
      }
      .chat-messages .message.assistant,
      .chat-messages .message.system,
      .chat-messages .message.transcription {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.88) !important;
        color: var(--oc-text-strong) !important;
      }
      .chat-messages .message.error {
        align-self: flex-start;
        background: #fef2f2 !important;
        border-color: rgba(239, 68, 68, 0.2);
        color: #991b1b !important;
      }
      .chat-messages .message-time {
        font-size: 10px;
        color: #8b95a5 !important;
        margin-bottom: 3px;
        font-weight: 500;
      }
      .chat-messages .message-text {
        color: var(--oc-text-strong) !important;
        text-shadow: none !important;
        font-size: 12.5px;
        line-height: 1.45;
        white-space: normal;
      }
      .chat-messages .message-text strong {
        font-weight: 700;
        color: var(--oc-text-strong) !important;
      }
      .chat-messages .message-text em {
        color: var(--oc-text) !important;
      }
      .chat-messages .message-text code {
        background: rgba(15, 23, 42, 0.06) !important;
        color: #334155 !important;
        padding: 1px 4px;
        border-radius: 4px;
        font-size: 11px;
      }
      .chat-messages .message.assistant strong,
      .chat-messages .message.assistant em,
      .chat-messages .message.assistant code {
        color: inherit;
      }
      .chat-messages .message.assistant code {
        color: #334155 !important;
        background: rgba(15, 23, 42, 0.06) !important;
      }
      .thinking-dots .dot {
        display: inline-block;
        animation: oc-pulse 1.1s ease-in-out infinite;
        margin-right: 2px;
        color: #8b95a5;
      }
      .thinking-dots .dot:nth-child(2) { animation-delay: 0.15s; }
      .thinking-dots .dot:nth-child(3) { animation-delay: 0.3s; }

      @keyframes oc-pulse {
        0%, 100% { opacity: 0.35; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-1px); }
      }

      .chat-input-row {
        display: flex;
        gap: 8px;
        padding: 10px 12px 12px;
        border-top: 1px solid rgba(15, 23, 42, 0.06);
        align-items: flex-end;
      }
      #barChatInput {
        flex: 1;
        resize: none;
        min-height: 38px;
        max-height: 96px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 12px;
        color: var(--oc-text-strong);
        padding: 9px 11px;
        font-size: 13px;
        font-family: inherit;
        outline: none;
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
      }
      #barChatInput::placeholder { color: #9aa3b2; }
      #barChatInput:focus {
        border-color: rgba(55, 65, 81, 0.28);
        box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.06);
      }
      #barChatSend {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        border: 1px solid rgba(15, 23, 42, 0.10);
        background: #ffffff;
        color: var(--oc-text-strong);
        cursor: pointer;
        display: grid;
        place-items: center;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        transition: transform 160ms var(--oc-ease), background 160ms ease;
      }
      #barChatSend:hover { background: #f3f4f6; transform: scale(1.04); }
      #barChatSend svg { width: 15px; height: 15px; }
    </style>
  </head>
  <body data-oc-light-bar="1">
    <div class="oc-shell" id="ocShell">
      <div class="command-tab" id="commandTab">
        <button type="button" class="oc-close" id="ocCloseBtn" title="Collapse" aria-label="Collapse">
          <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>

        <div class="oc-actions">
          <button type="button" class="oc-pill-btn" id="ocAskBtn">Ask</button>
          <button type="button" class="oc-pill-btn" id="ocAutoBtn">Auto Answer</button>
        </div>

        <button type="button" class="oc-drag" id="ocDragHandle" title="Drag to move" aria-label="Drag bar">
          <span class="oc-drag-dots" aria-hidden="true">
            <span></span><span></span>
            <span></span><span></span>
            <span></span><span></span>
          </span>
        </button>
      </div>

      <div class="chat-drawer" id="chatDrawer" aria-hidden="true">
        <div class="chat-drawer-inner">
          <div class="chat-drawer-header">
            <span id="chatModeLabel">Ask</span>
            <span class="hint" id="chatModeHint">Type a question…</span>
          </div>
          <div class="chat-messages" id="barChatMessages"></div>
          <div class="chat-input-row">
            <textarea id="barChatInput" rows="1" placeholder="Type a message… (Shift+Enter for newline)"></textarea>
            <button type="button" id="barChatSend" title="Send" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 12h12M13 6l7 6-7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="./src/ui/bar-chat.js"></script>
  </body>
</html>
