<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clyra AI</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      .clyra-boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #0f172a;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .clyra-boot-card {
        width: min(280px, calc(100vw - 48px));
        text-align: center;
      }

      .clyra-boot-orb {
        width: 72px;
        height: 72px;
        margin: 0 auto;
        border-radius: 999px;
        background:
          radial-gradient(circle at 30% 35%, #9ff3ff 0, transparent 32%),
          radial-gradient(circle at 68% 28%, #8b5cf6 0, transparent 38%),
          radial-gradient(circle at 54% 72%, #38bdf8 0, transparent 42%),
          #64748b;
        box-shadow: 0 24px 70px rgba(99, 102, 241, 0.22);
        animation: clyra-boot-pulse 1.8s ease-in-out infinite;
      }

      .clyra-boot-copy {
        margin: 14px 0 0;
        color: #64748b;
        font-size: 13px;
        line-height: 1.5;
      }

      .clyra-boot-reload {
        margin-top: 18px;
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        background: #0f172a;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        padding: 10px 16px;
      }

      @keyframes clyra-boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.88;
        }
        50% {
          transform: scale(1.04);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="clyra-boot-fallback" role="status" aria-live="polite" aria-label="Loading Clyra">
        <div class="clyra-boot-card">
          <div class="clyra-boot-orb" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          var target = event && event.target;
          var isAsset =
            target &&
            target !== window &&
            (target.tagName === "SCRIPT" || target.tagName === "LINK");

          if (!isAsset) return;

          var root = document.getElementById("root");
          // React replaces the boot fallback as soon as it mounts. Never let a
          // later, non-critical stylesheet or preload error overwrite the app.
          if (!root || !root.querySelector(":scope > .clyra-boot-fallback")) return;
          root.setAttribute(
            "data-clyra-failed-asset",
            target.src || target.href || target.getAttribute("src") || target.getAttribute("href") || "unknown",
          );

          root.innerHTML =
            '<div class="clyra-boot-fallback" role="alert">' +
            '<div class="clyra-boot-card">' +
            '<div class="clyra-boot-orb" aria-hidden="true"></div>' +
            '<p class="clyra-boot-copy">Clyra did not finish loading. Reloading usually fixes this after the dev server finishes rebuilding.</p>' +
            '<button class="clyra-boot-reload" type="button" onclick="window.location.reload()">Reload Clyra</button>' +
            "</div>" +
            "</div>";
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
