<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clyra AI</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      .clyra-boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #0f172a;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .clyra-boot-card {
        width: min(280px, calc(100vw - 48px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }

      .clyra-boot-track {
        width: min(250px, 100%);
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: #e9eef5;
      }

      .clyra-boot-fill {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #0f172a;
        animation: clyra-boot-progress 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .clyra-boot-copy {
        margin: 0;
        color: #64748b;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.5;
      }

      .clyra-boot-reload {
        margin-top: 18px;
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        background: #0f172a;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        padding: 10px 16px;
      }

      @keyframes clyra-boot-progress {
        from { transform: translateX(-118%); }
        to { transform: translateX(238%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .clyra-boot-fill { animation: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="clyra-boot-fallback">
        <div class="clyra-boot-card">
          <div class="clyra-boot-track">
            <div class="clyra-boot-fill"></div>
          </div>
          <p class="clyra-boot-copy">Starting Clyra...</p>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          var target = event && event.target;
          var isAsset =
            target &&
            target !== window &&
            (target.tagName === "SCRIPT" || target.tagName === "LINK");

          if (!isAsset) return;

          var root = document.getElementById("root");
          // React replaces the boot fallback as soon as it mounts. Never let a
          // later, non-critical stylesheet or preload error overwrite the app.
          if (!root || !root.querySelector(":scope > .clyra-boot-fallback")) return;
          root.setAttribute(
            "data-clyra-failed-asset",
            target.src || target.href || target.getAttribute("src") || target.getAttribute("href") || "unknown",
          );

          // Vite can briefly miss a module while rebuilding a large chunk.
          // Keep the existing boot surface intact so React can still mount on
          // the next successful module request instead of replacing the app
          // with a permanent false failure screen.
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
